<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8; color: #1a202c; padding: 32px 20px;
  }
  h1 { font-size: 1.8rem; margin-bottom: 6px; }
  .subtitle { color: #64748b; margin-bottom: 28px; font-size: 0.95rem; }
  .refresh-btn {
    display: inline-block; margin-bottom: 24px;
    padding: 10px 20px; background: #6366f1; color: #fff;
    border: none; border-radius: 10px; font-size: 1rem;
    cursor: pointer; font-weight: 600;
  }
  .refresh-btn:hover { background: #4f46e5; }
  table {
    width: 100%; border-collapse: collapse;
    background: #fff; border-radius: 16px;
    overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  thead { background: #6366f1; color: #fff; }
  th, td { padding: 14px 18px; text-align: left; font-size: 0.95rem; }
  th { font-weight: 600; letter-spacing: 0.03em; }
  tr:nth-child(even) td { background: #f8fafc; }
  tr:hover td { background: #eff6ff; }
  .accuracy-bar-wrap {
    background: #e2e8f0; border-radius: 99px;
    height: 10px; width: 100px; display: inline-block;
    vertical-align: middle; margin-left: 8px;
  }
  .accuracy-bar {
    background: #16a34a; border-radius: 99px;
    height: 10px; transition: width 0.4s;
  }
  .accuracy-bar.mid { background: #f59e0b; }
  .accuracy-bar.low { background: #dc2626; }
  .acc-label { font-weight: 600; }
  .no-data { text-align: center; color: #94a3b8; padding: 40px; }
  .summary { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .summary-card {
    background: #fff; border-radius: 12px; padding: 16px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07); flex: 1; min-width: 140px;
  }
  .summary-card .label {
    font-size: 0.8rem; color: #64748b;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .summary-card .value {
    font-size: 1.8rem; font-weight: 700; color: #6366f1; margin-top: 4px;
  }
</style>
</head>
<body>

<h1>📊 Teacher Dashboard</h1>
<p class="subtitle">Student performance overview</p>

<div class="summary">
  <div class="summary-card">
    <div class="label">Students</div>
    <div class="value" id="stat-students">—</div>
  </div>
  <div class="summary-card">
    <div class="label">Total Questions</div>
    <div class="value" id="stat-attempted">—</div>
  </div>
  <div class="summary-card">
    <div class="label">Avg Accuracy</div>
    <div class="value" id="stat-accuracy">—</div>
  </div>
  <div class="summary-card">
    <div class="label">Top Score</div>
    <div class="value" id="stat-top">—</div>
  </div>
</div>

<button class="refresh-btn" id="refresh-btn">Refresh</button>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Student</th>
      <th>Points</th>
      <th>Correct</th>
      <th>Attempted</th>
      <th>Accuracy</th>
    </tr>
  </thead>
  <tbody id="teacher-student-table">
    <tr><td colspan="6" class="no-data">Loading...</td></tr>
  </tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAzvhvP1xYTvoW1SPURneDwpdCYj_NXAFk",
    authDomain: "student-math-practice.firebaseapp.com",
    databaseURL: "https://student-math-practice-default-rtdb.firebaseio.com",
    projectId: "student-math-practice",
    storageBucket: "student-math-practice.firebasestorage.app",
    messagingSenderId: "817731587245",
    appId: "1:817731587245:web:13aa1c244f7ce18e0cca24"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function loadData() {
    const tbody = document.getElementById("teacher-student-table");
    tbody.innerHTML = `<tr><td colspan="6" class="no-data">Loading...</td></tr>`;

    db.ref("students").once("value").then(snapshot => {
      tbody.innerHTML = "";

      if (!snapshot.exists()) {
        tbody.innerHTML = `<tr><td colspan="6" class="no-data">No student data yet</td></tr>`;
        return;
      }

      const students = [];

snapshot.forEach(child => {
  console.log("KEY:", child.key);
  console.log("VALUE:", child.val());

  students.push(child.val());
});

      const totalStudents  = students.length;
      const totalAttempted = students.reduce((s, x) => s + (x.attempted || 0), 0);
      const totalCorrect   = students.reduce((s, x) => s + (x.correct   || 0), 0);
      const avgAccuracy    = totalAttempted > 0
        ? Math.round((totalCorrect / totalAttempted) * 100) : 0;
      const topScore = students[0]?.points || 0;

      document.getElementById("stat-students").textContent  = totalStudents;
      document.getElementById("stat-attempted").textContent = totalAttempted;
      document.getElementById("stat-accuracy").textContent  = avgAccuracy + "%";
      document.getElementById("stat-top").textContent       = topScore;

      tbody.innerHTML = students.map((s, i) => {
        const correct   = s.correct   || 0;
        const attempted = s.attempted || 0;
        const pct       = attempted > 0
          ? Math.round((correct / attempted) * 100) : 0;
        const barClass  = pct >= 75 ? "" : pct >= 50 ? "mid" : "low";

        return `
          <tr>
            <td>${i + 1}</td>
            <td>${s.name || "Unknown"}</td>
            <td><strong>${s.points || 0}</strong></td>
            <td>${correct}</td>
            <td>${attempted}</td>
            <td>
              <span class="acc-label">${pct}%</span>
              <span class="accuracy-bar-wrap">
                <span class="accuracy-bar ${barClass}" style="width:${pct}px"></span>
              </span>
            </td>
          </tr>`;
      }).join("");

    }).catch(err => {
      tbody.innerHTML = `<tr><td colspan="6" class="no-data">
        Error loading data: ${err.message}
      </td></tr>`;
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("refresh-btn").addEventListener("click", loadData);
    loadData();
  });
</script>

</body>
</html>
