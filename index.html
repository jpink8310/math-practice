<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8; color: #1a202c;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px;
    max-width: 480px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    text-align: center;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .points-display {
    font-size: 1.2rem; color: #6366f1; font-weight: 600; margin-bottom: 24px;
  }
  .question {
    font-size: 2rem; font-weight: 700; margin: 24px 0;
    color: #1e293b;
  }
  input, button, select {
    font-size: 1.1rem; padding: 12px 20px; border-radius: 10px;
    border: 2px solid #e2e8f0; outline: none; width: 100%;
    margin-bottom: 12px;
  }
  input:focus { border-color: #6366f1; }
  button {
    background: #6366f1; color: #fff; border: none;
    cursor: pointer; font-weight: 600; transition: background 0.2s;
  }
  button:hover { background: #4f46e5; }
  button:active { transform: scale(0.98); }
  .feedback {
    font-size: 1.3rem; font-weight: 700; margin: 16px 0;
    min-height: 40px;
  }
  .correct { color: #16a34a; }
  .incorrect { color: #dc2626; }
  .streak { font-size: 0.95rem; color: #64748b; margin-bottom: 16px; }
  select { background: #fff; }
  .settings { display: flex; gap: 8px; margin-bottom: 16px; }
  .settings select { flex: 1; }
  .btn-secondary {
    background: #e2e8f0; color: #475569;
  }
  .btn-secondary:hover { background: #cbd5e1; }
  .celebration {
    font-size: 3rem; animation: pop 0.4s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="card" id="app">
  <!-- Login Screen -->
  <div id="login-screen">
    <h1>🧮 Math Practice</h1>
    <p style="margin-bottom:24px;color:#64748b;">Enter your name to start</p>
    <input type="text" id="name-input" placeholder="Your name" autocomplete="off">
    <button onclick="startApp()">Let's Go!</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" style="display:none;">
    <h1>🧮 Math Practice</h1>
    <div class="points-display">
      <span id="student-name"></span> — <span id="points">0</span> points
    </div>
    <div class="settings">
     
    </div>
    <div class="question" id="question-text">Loading...</div>
    <div class="feedback" id="feedback"></div>
    <input type="number" id="answer-input" placeholder="Your answer"
           onkeydown="if(event.key==='Enter') checkAnswer()" inputmode="numeric">
    <button onclick="checkAnswer()">Submit</button>
    <div class="streak" id="streak-display"></div>
    <button class="btn-secondary" onclick="logout()">Change Student</button>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
 
<script>
// ========== FIREBASE CONFIG — REPLACE WITH YOURS ==========
const firebaseConfig = {
  apiKey: "AIzaSyAzvhvP1xYTvoW1SPURneDwpdCYj_NXAFk",
  authDomain: "student-math-practice.firebaseapp.com",
  projectId: "student-math-practice",
  storageBucket: "student-math-practice.firebasestorage.app",
  messagingSenderId: "817731587245",
  appId: "1:817731587245:web:13aa1c244f7ce18e0cca24"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ========== QUESTION BANK (add/edit as needed) ==========
const fractionBank = [
  { q: "What is 1/2 + 1/4? (answer as a decimal)", a: 0.75 },
  { q: "What is 3/4 + 1/4? (answer as a decimal)", a: 1 },
  { q: "What is 2/5 + 1/5? (answer as a decimal)", a: 0.6 },
  { q: "What is 4/10 - 1/10? (answer as a decimal)", a: 0.3 },
  { q: "What is 2/3 + 1/6? (answer as a decimal)", a: 0.8333 },
  { q: "What is 5/8 - 1/4? (answer as a decimal)", a: 0.375 },
  { q: "What is 1/4 + 1/2? (answer as a decimal)", a: 0.75 },
  { q: "What is 7/10 - 2/10? (answer as a decimal)", a: 0.5 }
];

// ========== STATE ==========
let studentName = "";
let studentKey = "";
let points = 0;
let streak = 0;
let currentAnswer = 0;
let answered = false;

  // Avoid negative results for subtraction
  if (op === "−" && b > a) [a, b] = [b, a];

  switch (op) {
    case "+": answer = a + b; break;
    case "−": answer = a - b; break;
    case "×": answer = a * b; break;
  }
  question = `${a} ${op} ${b} = ?`;
  return { q: question, a: answer };
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function multiplicationFact() {
  const a = randInt(1, 12);
  const b = randInt(1, 12);
  return {
    q: `What is ${a} × ${b}?`,
    a: a * b
  };
}

function twoDigitOneDigit() {
  const a = randInt(10, 99);
  const b = randInt(2, 9);

  return {
    q: `What is ${a} × ${b}?`,
    a: a * b
  };
}

function twoDigitTwoDigit() {
  const a = randInt(10, 99);
  const b = randInt(10, 99);

  return {
    q: `What is ${a} × ${b}?`,
    a: a * b
  };
}

function divisionQuestion() {
  const answer = randInt(2, 50);
  const divisor = randInt(2, 12);
  const dividend = answer * divisor;

  return {
    q: `What is ${dividend} ÷ ${divisor}?`,
    a: answer
  };
}

function fractionQuestion() {
  return fractionBank[randInt(0, fractionBank.length - 1)];
}

function roundingQuestion() {
  const number = +(Math.random() * 100).toFixed(3);

  if (Math.random() < 0.5) {
    return {
      q: `Round ${number} to the nearest tenth`,
      a: Number(number.toFixed(1))
    };
  }

  return {
    q: `Round ${number} to the nearest hundredth`,
    a: Number(number.toFixed(2))
  };
}
// ========== APP LOGIC ==========
function startApp() {
  const name = document.getElementById("name-input").value.trim();
  if (!name) return;

  studentName = name;
  studentKey = name.toLowerCase().replace(/[^a-z0-9]/g, "_");

  // Load or create student in Firebase
  db.ref("students/" + studentKey).once("value").then(snapshot => {
    if (snapshot.exists()) {
      points = snapshot.val().points || 0;
    } else {
      points = 0;
      db.ref("students/" + studentKey).set({ name: studentName, points: 0 });
    }

    document.getElementById("student-name").textContent = studentName;
    document.getElementById("points").textContent = points;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    generateQuestion();
  });
}

function generateQuestion() {
  answered = false;

  document.getElementById("feedback").textContent = "";
  document.getElementById("answer-input").value = "";
  document.getElementById("answer-input").focus();

  const generators = [
    multiplicationFact,
    twoDigitOneDigit,
    twoDigitTwoDigit,
    divisionQuestion,
    fractionQuestion,
    roundingQuestion
  ];

  const questionObj =
    generators[randInt(0, generators.length - 1)]();

  currentAnswer = questionObj.a;
  document.getElementById("question-text").textContent =
    questionObj.q;
}

function checkAnswer() {
  if (answered) { generateQuestion(); return; }

  const input = document.getElementById("answer-input").value.trim();
  if (input === "") return;

  const userAnswer = parseFloat(input);
  const feedback = document.getElementById("feedback");
  answered = true;

  if (userAnswer === currentAnswer) {
    // Points scale with difficulty
    streak++;

const award = 1;
const bonus = streak >= 5 ? 1 : 0;
const total = award + bonus;

points += total;

    feedback.className = "feedback correct celebration";
    let msg = `✅ Correct! +${total} point${total > 1 ? "s" : ""}`;
    if (bonus) msg += " (🔥 streak bonus!)";
    feedback.textContent = msg;

    // Save to Firebase
    db.ref("students/" + studentKey + "/points").set(points);
    document.getElementById("points").textContent = points;
  } else {
    streak = 0;
    feedback.className = "feedback incorrect";
    feedback.textContent = `❌ The answer was ${currentAnswer}`;
  }

  updateStreak();

  // Auto-advance after a pause
  setTimeout(() => {
    if (answered) generateQuestion();
  }, 2000);
}

function updateStreak() {
  const el = document.getElementById("streak-display");
  el.textContent = streak > 1 ? `🔥 ${streak} in a row!` : "";
}

function logout() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("login-screen").style.display = "block";
  document.getElementById("name-input").value = "";
  streak = 0;
}
</script>
</body>
</html>
