<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f4f8; color: #1a202c;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px;
    max-width: 480px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    text-align: center;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .points-display {
    font-size: 1.2rem; color: #6366f1; font-weight: 600; margin-bottom: 24px;
  }
  .question {
    font-size: 2rem; font-weight: 700; margin: 24px 0; color: #1e293b;
  }
  input, button, select {
    font-size: 1.1rem; padding: 12px 20px; border-radius: 10px;
    border: 2px solid #e2e8f0; outline: none; width: 100%; margin-bottom: 12px;
  }
  input:focus { border-color: #6366f1; }
  button {
    background: #6366f1; color: #fff; border: none;
    cursor: pointer; font-weight: 600; transition: background 0.2s;
  }
  button:hover { background: #4f46e5; }
  button:active { transform: scale(0.98); }
  .feedback {
    font-size: 1.3rem; font-weight: 700; margin: 16px 0; min-height: 40px;
  }
  .correct { color: #16a34a; }
  .incorrect { color: #dc2626; }
  .streak { font-size: 0.95rem; color: #64748b; margin-bottom: 16px; }
  select { background: #fff; }
  .settings { display: flex; gap: 8px; margin-bottom: 16px; }
  .settings select { flex: 1; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .celebration { animation: pop 0.4s ease-out; }

  /* Leaderboard */
  .leaderboard { margin-top: 24px; text-align: left; }
  .leaderboard h2 { font-size: 1.1rem; color: #6366f1; margin-bottom: 12px; text-align: center; }
  .lb-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-radius: 8px; margin-bottom: 6px;
    background: #f8fafc; font-size: 0.95rem;
  }
  .lb-row.gold   { background: #fef9c3; font-weight: 700; }
  .lb-row.silver { background: #f1f5f9; font-weight: 600; }
  .lb-row.bronze { background: #fdf4e7; font-weight: 600; }
  .lb-rank { width: 28px; color: #94a3b8; font-weight: 700; }
  .lb-name { flex: 1; padding: 0 8px; }
  .lb-pts { color: #6366f1; font-weight: 700; }
 .layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

.sidebar {
  width: 240px;
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.1);
}

.sidebar h2 {
  text-align: center;
  color: #6366f1;
  margin-bottom: 12px;
}

@media (max-width: 900px) {
  .layout {
    flex-direction: column;
    align-items: center;
  }

  .sidebar {
    width: 100%;
    max-width: 480px;
    order: 2;
  }

  .card {
    order: 1;
  }
}
</style>
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>🏆 Top 5 Students</h2>
    <div id="sidebar-leaderboard">
      <p style="color:#94a3b8;text-align:center;">Loading...</p>
    </div>
  </div>

  <div class="card" id="app">

  <!-- Login Screen -->
  <div id="login-screen">
    <h1>🧮 Math Practice</h1>
    <p style="margin-bottom:24px; color:#64748b;">Enter your name to start</p>
    <input type="text" id="name-input" placeholder="Your name" autocomplete="off">
    <button id="start-btn">Let's Go!</button>

  <!-- Quiz Screen -->
  <div id="quiz-screen" style="display:none;">
    <h1>🧮 Math Practice</h1>
    <div class="points-display">
      <span id="student-name"></span> — <span id="points">0</span> points
    </div>
    <div class="question" id="question-text">Loading...</div>
    <div class="feedback" id="feedback"></div>
    <input type="number" id="answer-input" placeholder="Your answer" inputmode="numeric">
    <button id="submit-btn">Submit</button>
    <div class="streak" id="streak-display"></div>
    <button class="btn-secondary" id="logout-btn">Change Student</button>
  </div>

</div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
  // ========== FIREBASE CONFIG ==========
  const firebaseConfig = {
  apiKey: "AIzaSyAzvhvP1xYTvoW1SPURneDwpdCYj_NXAFk",
  authDomain: "student-math-practice.firebaseapp.com",
  projectId: "student-math-practice",
  storageBucket: "student-math-practice.firebasestorage.app",
  messagingSenderId: "817731587245",
  appId: "1:817731587245:web:13aa1c244f7ce18e0cca24"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

  // ========== STATE ==========
  let studentName = "";
  let studentKey = "";
  let points = 0;
  let streak = 0;
  let currentAnswer = 0;
  let answered = false;

  // ========== HELPERS ==========
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // ========== QUESTION GENERATORS ==========
  function multiplicationFact() {
    const a = randInt(1, 12), b = randInt(1, 12);
    return { q: `What is ${a} x ${b}?`, a: a * b };
  }

  function twoDigitOneDigit() {
    const a = randInt(10, 99), b = randInt(2, 9);
    return { q: `What is ${a} x ${b}?`, a: a * b };
  }

  function twoDigitTwoDigit() {
    const a = randInt(10, 99), b = randInt(10, 99);
    return { q: `What is ${a} x ${b}?`, a: a * b };
  }

  function divisionQuestion() {
    const answer = randInt(2, 50), divisor = randInt(2, 12);
    return { q: `What is ${answer * divisor} / ${divisor}?`, a: answer };
  }

  function twoDigitAddition() {
    const a = randInt(10, 99), b = randInt(10, 99);
    return { q: `What is ${a} + ${b}?`, a: a + b };
  }

  function twoDigitSubtraction() {
    const a = randInt(10, 99), b = randInt(10, 99);
    const big = Math.max(a, b), small = Math.min(a, b);
    return { q: `What is ${big} - ${small}?`, a: big - small };
  }

  function threeDigitAddition() {
    const a = randInt(100, 999), b = randInt(100, 999);
    return { q: `What is ${a} + ${b}?`, a: a + b };
  }

  function threeDigitSubtraction() {
    const a = randInt(100, 999), b = randInt(100, 999);
    const big = Math.max(a, b), small = Math.min(a, b);
    return { q: `What is ${big} - ${small}?`, a: big - small };
  }

  function roundingQuestion() {
    const number = +(Math.random() * 100).toFixed(3);
    if (Math.random() < 0.5) {
      return { q: `Round ${number} to the nearest tenth`, a: Number(number.toFixed(1)) };
    }
    return { q: `Round ${number} to the nearest hundredth`, a: Number(number.toFixed(2)) };
  }

  const generators = [
    multiplicationFact,
    twoDigitOneDigit,
    twoDigitTwoDigit,
    divisionQuestion,
    twoDigitAddition,
    twoDigitSubtraction,
    threeDigitAddition,
    threeDigitSubtraction,
    roundingQuestion
  ];

  // ========== APP FUNCTIONS ==========
  function generateQuestion() {
    answered = false;
    document.getElementById("feedback").textContent = "";
    document.getElementById("answer-input").value = "";
    document.getElementById("answer-input").focus();

    const questionObj = generators[randInt(0, generators.length - 1)]();
    currentAnswer = questionObj.a;
    document.getElementById("question-text").textContent = questionObj.q;
  }

  async function startApp() {
    const name = document.getElementById("name-input").value.trim();
    if (!name) return;

    studentName = name;
    studentKey = name.toLowerCase().replace(/[^a-z0-9]/g, "_");

    try {
      const snapshot = await db.ref("students/" + studentKey).once("value");
      if (snapshot.exists()) {
        points = snapshot.val().points || 0;
      } else {
        points = 0;
        await db.ref("students/" + studentKey).set({
          name: studentName, points: 0, correct: 0, attempted: 0
        });
      }

      document.getElementById("student-name").textContent = studentName;
      document.getElementById("points").textContent = points;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      generateQuestion();
    } catch (err) {
      alert("Could not connect. Check your Firebase config.\n\n" + err.message);
    }
  }

  async function checkAnswer() {
    if (answered) { generateQuestion(); return; }

    const input = document.getElementById("answer-input").value.trim();
    if (input === "") return;

    const userAnswer = parseFloat(input);
    const feedback = document.getElementById("feedback");
    answered = true;

    // Read current stats
    const snap = await db.ref("students/" + studentKey).once("value");
    const data = snap.val() || {};
    const prevCorrect   = data.correct   || 0;
    const prevAttempted = data.attempted || 0;

    if (userAnswer === currentAnswer) {
      streak++;
      const award = 1;
      const bonus = streak >= 5 ? 1 : 0;
      const total = award + bonus;
      points += total;

      feedback.className = "feedback correct celebration";
      let msg = `Correct! +${total} point${total > 1 ? "s" : ""}`;
      if (bonus) msg += " (streak bonus!)";
      feedback.textContent = msg;

      await db.ref("students/" + studentKey).update({
        points:    points,
        correct:   prevCorrect + 1,
        attempted: prevAttempted + 1
      });
      document.getElementById("points").textContent = points;
    } else {
      streak = 0;
      feedback.className = "feedback incorrect";
      feedback.textContent = `The answer was ${currentAnswer}`;

      await db.ref("students/" + studentKey).update({
        attempted: prevAttempted + 1
      });
    }

    document.getElementById("streak-display").textContent =
      streak > 1 ? `${streak} in a row!` : "";

    setTimeout(() => { if (answered) generateQuestion(); }, 2000);
  }

  function logout() {
    studentName = ""; studentKey = ""; points = 0; streak = 0; answered = false;
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("login-screen").style.display = "block";
    document.getElementById("name-input").value = "";
    loadLeaderboard();
  }

  // ========== LEADERBOARD ==========
  function loadLeaderboard() {
  db.ref("students").once("value").then(snapshot => {

    console.log("CHILD COUNT:", snapshot.numChildren());
    console.log("RAW DATA:", snapshot.val());

    const entries = [];

    snapshot.forEach(child => {
      console.log("STUDENT:", child.key, child.val());
      entries.push({
        id: child.key,
        ...child.val()
      });
    });

    console.log("ENTRIES ARRAY:", entries);

    entries.sort((a, b) => (b.points || 0) - (a.points || 0));

    console.log("SORTED ENTRIES:", entries);

    const list = document.getElementById("leaderboard-list");

    list.innerHTML = entries.map((s, i) => `
      <div class="lb-row">
        <span class="lb-rank">${i + 1}</span>
        <span class="lb-name">${s.name || s.id}</span>
        <span class="lb-pts">${s.points || 0}</span>
      </div>
    `).join("");
  });
}
function loadSidebarLeaderboard() {
  db.ref("students")
    .orderByChild("points")
    .limitToLast(5)
    .once("value")
    .then(snapshot => {

      const container = document.getElementById("sidebar-leaderboard");

      if (!snapshot.exists()) {
        container.innerHTML = "<p style='color:#94a3b8;text-align:center;'>No scores yet</p>";
        return;
      }

      const entries = [];
      snapshot.forEach(child => entries.push(child.val()));

      entries.sort((a, b) => (b.points || 0) - (a.points || 0));

      const medals = ["🥇", "🥈", "🥉"];

      container.innerHTML = entries.map((s, i) => `
        <div class="lb-row">
          <span class="lb-rank">${medals[i] || (i + 1)}</span>
          <span class="lb-name">${s.name || "Unknown"}</span>
          <span class="lb-pts">${s.points || 0}</span>
        </div>
      `).join("");
    });
}
  // ========== EVENT LISTENERS ==========
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("start-btn").addEventListener("click", startApp);
    document.getElementById("submit-btn").addEventListener("click", checkAnswer);
    document.getElementById("logout-btn").addEventListener("click", logout);
    document.getElementById("name-input").addEventListener("keydown", e => { if (e.key === "Enter") startApp(); });
    document.getElementById("answer-input").addEventListener("keydown", e => { if (e.key === "Enter") checkAnswer(); });
    loadLeaderboard();
   loadSidebarLeaderboard();
  });
</script>
</body>
</html>
