<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8; color: #1a202c;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px;
      max-width: 480px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .points-display {
      font-size: 1.2rem; color: #6366f1; font-weight: 600; margin-bottom: 24px;
    }
    .question {
      font-size: 2rem; font-weight: 700; margin: 24px 0; color: #1e293b;
    }
    input, button, select {
      font-size: 1.1rem; padding: 12px 20px; border-radius: 10px;
      border: 2px solid #e2e8f0; outline: none; width: 100%; margin-bottom: 12px;
    }
    input:focus { border-color: #6366f1; }
    button {
      background: #6366f1; color: #fff; border: none;
      cursor: pointer; font-weight: 600; transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    button:active { transform: scale(0.98); }
    .feedback {
      font-size: 1.3rem; font-weight: 700; margin: 16px 0; min-height: 40px;
    }
    .correct { color: #16a34a; }
    .incorrect { color: #dc2626; }
    .streak { font-size: 0.95rem; color: #64748b; margin-bottom: 16px; }
    select { background: #fff; }
    .settings { display: flex; gap: 8px; margin-bottom: 16px; }
    .settings select { flex: 1; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    .celebration { animation: pop 0.4s ease-out; }
  </style>
</head>
<body>

<div class="card" id="app">

  <!-- Login Screen -->
  <div id="login-screen">
    <h1>🧮 Math Practice</h1>
    <p style="margin-bottom:24px; color:#64748b;">Enter your name to start</p>
    <input type="text" id="name-input" placeholder="Your name" autocomplete="off">
    <button id="start-btn">Let's Go!</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" style="display:none;">
    <h1>🧮 Math Practice</h1>
    <div class="points-display">
      <span id="student-name"></span> — <span id="points">0</span> points
    </div>
    <div class="settings">
      <select id="mode-select">
        <option value="random">Random Questions</option>
        <option value="bank">Question Bank</option>
      </select>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="question" id="question-text">Loading...</div>
    <div class="feedback" id="feedback"></div>
    <input type="number" id="answer-input" placeholder="Your answer" inputmode="numeric">
    <button id="submit-btn">Submit</button>
    <div class="streak" id="streak-display"></div>
    <button class="btn-secondary" id="logout-btn">Change Student</button>
  </div>

</div>

<script type="module">
  // ========== FIREBASE IMPORTS ==========
  import { initializeApp } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js)";
  import { getDatabase, ref, get, set } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js)";

  // ========== FIREBASE CONFIG — REPLACE WITH YOURS ==========
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "[your_project-default-rtdb.firebaseio.com](https://YOUR_PROJECT-default-rtdb.firebaseio.com)",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ========== QUESTION BANK ==========
  const questionBank = [
    { q: "What is 25% of 200?", a: 50 },
    { q: "What is 12 x 12?", a: 144 },
    { q: "What is 81 / 9?", a: 9 },
    { q: "What is 15 squared?", a: 225 },
    { q: "What is the square root of 144?", a: 12 },
    { q: "What is 3/4 as a percentage?", a: 75 },
    { q: "What is 1000 - 387?", a: 613 },
    { q: "What is 17 x 6?", a: 102 },
    { q: "What is 2 to the power of 5?", a: 32 },
    { q: "What is 450 / 15?", a: 30 },
    { q: "What is 7 x 8 + 9?", a: 65 },
    { q: "What is 1/5 of 350?", a: 70 },
  ];

  // ========== STATE ==========
  let studentName = "";
  let studentKey = "";
  let points = 0;
  let streak = 0;
  let currentAnswer = 0;
  let answered = false;

  // ========== HELPERS ==========
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomQuestion(difficulty) {
    let a, b, op, answer;
    const ops = ["+", "-", "x"];

    if (difficulty === "easy") {
      a = randInt(1, 20); b = randInt(1, 20);
    } else if (difficulty === "medium") {
      a = randInt(10, 100); b = randInt(2, 50);
    } else {
      a = randInt(20, 200); b = randInt(5, 100);
    }

    op = ops[randInt(0, 2)];
    if (op === "-" && b > a) [a, b] = [b, a];

    switch (op) {
      case "+": answer = a + b; break;
      case "-": answer = a - b; break;
      case "x": answer = a * b; break;
    }

    return { q: `${a} ${op} ${b} = ?`, a: answer };
  }

  // ========== APP FUNCTIONS ==========
  async function startApp() {
    const name = document.getElementById("name-input").value.trim();
    if (!name) return;

    studentName = name;
    studentKey = name.toLowerCase().replace(/[^a-z0-9]/g, "_");

    try {
      const snapshot = await get(ref(db, "students/" + studentKey));
      if (snapshot.exists()) {
        points = snapshot.val().points || 0;
      } else {
        points = 0;
        await set(ref(db, "students/" + studentKey), { name: studentName, points: 0 });
      }

      document.getElementById("student-name").textContent = studentName;
      document.getElementById("points").textContent = points;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      generateQuestion();
    } catch (err) {
      alert("Could not connect to database. Check your Firebase config.\n\n" + err.message);
    }
  }

  function generateQuestion() {
    answered = false;
    document.getElementById("feedback").textContent = "";
    document.getElementById("answer-input").value = "";
    document.getElementById("answer-input").focus();

    const mode = document.getElementById("mode-select").value;
    const difficulty = document.getElementById("difficulty-select").value;
    let questionObj;

    if (mode === "bank") {
      questionObj = questionBank[randInt(0, questionBank.length - 1)];
    } else {
      questionObj = randomQuestion(difficulty);
    }

    currentAnswer = questionObj.a;
    document.getElementById("question-text").textContent = questionObj.q;
  }

  async function checkAnswer() {
    if (answered) { generateQuestion(); return; }

    const input = document.getElementById("answer-input").value.trim();
    if (input === "") return;

    const userAnswer = parseFloat(input);
    const feedback = document.getElementById("feedback");
    answered = true;

    if (userAnswer === currentAnswer) {
      const diff = document.getElementById("difficulty-select").value;
      const award = diff === "easy" ? 1 : diff === "medium" ? 2 : 3;
      const bonus = streak >= 4 ? 1 : 0;
      const total = award + bonus;
      streak++;
      points += total;

      feedback.className = "feedback correct celebration";
      let msg = `Correct! +${total} point${total > 1 ? "s" : ""}`;
      if (bonus) msg += " (streak bonus!)";
      feedback.textContent = msg;

      await set(ref(db, "students/" + studentKey + "/points"), points);
      document.getElementById("points").textContent = points;
    } else {
      streak = 0;
      feedback.className = "feedback incorrect";
      feedback.textContent = `The answer was ${currentAnswer}`;
    }

    document.getElementById("streak-display").textContent =
      streak > 1 ? `${streak} in a row!` : "";

    setTimeout(() => { if (answered) generateQuestion(); }, 2000);
  }

  function logout() {
    studentName = ""; studentKey = ""; points = 0; streak = 0; answered = false;
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("login-screen").style.display = "block";
    document.getElementById("name-input").value = "";
  }

  // ========== EVENT LISTENERS ==========
  document.getElementById("start-btn").addEventListener("click", startApp);
  document.getElementById("submit-btn").addEventListener("click", checkAnswer);
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("name-input").addEventListener("keydown", e => { if (e.key === "Enter") startApp(); });
  document.getElementById("answer-input").addEventListener("keydown", e => { if (e.key === "Enter") checkAnswer(); });
  document.getElementById("mode-select").addEventListener("change", generateQuestion);
  document.getElementById("difficulty-select").addEventListener("change", generateQuestion);
</script>

</body>
</html>
